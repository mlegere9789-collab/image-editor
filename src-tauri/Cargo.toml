[package]
name = "image-editor"
version = "0.1.0"
description = "Desktop image editor"
edition = "2021"
rust-version = "1.77.2"

[lib]
# The desktop binary is a thin shell around this lib so the same entry point can
# be reused by mobile targets later.
name = "image_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
